# Builds the iPhone app on a Codemagic cloud Mac and uploads it to App Store
# Connect (TestFlight). Started by hand from codemagic.io: Start new build >
# "iOS App Store".
#
# Needs, in Codemagic Team settings > Integrations > Developer Portal, an App
# Store Connect API key saved under the name "Vocation SL App Store key".
# Signing is automatic: Codemagic creates the certificate and profile for
# bundle ID org.vocationsl.app.
#
# The version and build number come from pubspec.yaml (e.g. 1.2.9+22); bump
# them before each upload, as Apple rejects a build number it has seen.
workflows:
  ios-release:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Vocation SL App Store key
    environment:
      flutter: 3.47.5
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.vocationsl.app
      vars:
        # Public values: the same ones are in the web app.
        SUPABASE_URL: https://gkglfqsvxyemykpnjxik.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_eN8hZ_bBW_flojrgei4uew_J-coAe0m
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Install pods
        script: cd ios && pod install --repo-update
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
