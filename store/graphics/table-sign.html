<!doctype html><html><head><meta charset='utf-8'>
<link href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap' rel='stylesheet'>
<style>
/* A4 table sign for the exhibition stand (put it in an A4 acrylic stand). Add ?android for Google Play only. */
@page{size:210mm 297mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0;width:210mm;height:297mm;overflow:hidden}
body{font-family:'Plus Jakarta Sans',sans-serif;color:#14171A;background:#fff;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.head{background:linear-gradient(160deg,#123009,#2C5A14);color:#fff;padding:14mm 14mm 12mm}
.brand{display:flex;align-items:center;gap:4mm}
.logo{width:17mm;height:17mm;border-radius:4.5mm;background:#fff;display:grid;place-items:center}
.logo svg{width:12.5mm;height:12.5mm}
.name{font-size:10mm;font-weight:800}
.name b{color:#9BD15A}
h1{margin:9mm 0 0;font-size:17mm;line-height:1.02;font-weight:800;letter-spacing:-.6mm}
h1 span{color:#9BD15A}
.body{padding:10mm 14mm 0;text-align:center}
.qrs{display:flex;justify-content:center;gap:10mm}
.qr .box{width:74mm;height:74mm;padding:4mm;border:.6mm solid #DCE6D2;border-radius:4mm}
.qr .box svg{width:100%;height:100%;display:block}
.qr img{display:block;margin:3mm auto 0;height:12mm}
.qr img.gp{height:17.5mm;margin:1mm auto -2.5mm}
.android .qr .box{width:110mm;height:110mm}
.android .qr img.gp{height:22mm}
.android .ios{display:none}
.search{margin-top:8mm;font-size:6.5mm;font-weight:600;color:#3D4738}
.chip{display:inline-flex;align-items:center;gap:2mm;padding:1.2mm 4.5mm;border-radius:99mm;background:#EEF5E4;border:.4mm solid #CFE3B4;font-weight:800;color:#14171A}
.chip svg{width:5mm;height:5mm}
.hire{position:absolute;left:14mm;right:14mm;bottom:22mm;border-radius:5mm;background:#EEF5E4;border:.5mm solid #CFE3B4;padding:6mm 7mm;display:flex;align-items:center;gap:5mm;text-align:left}
.hire .ic{width:13mm;height:13mm;border-radius:3.5mm;background:#3F7A1F;display:grid;place-items:center;flex:none}
.hire .ic svg{width:7.5mm;height:7.5mm}
.hire b{display:block;font-size:6.5mm;font-weight:800}
.hire span{display:block;font-size:4.6mm;font-weight:600;color:#3D4738;margin-top:.8mm}
.foot{position:absolute;left:0;right:0;bottom:9mm;text-align:center;font-size:4.2mm;font-weight:600;color:#5F6B5A}
.foot b{color:#3F7A1F}
</style></head><body>
<div class='head'>
  <div class='brand'>
    <div class='logo'><svg viewBox="0 0 100 100"><path d="M26 14 L50 86 L74 14" fill="none" stroke="#14171A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 86 L50 20 L72 86" fill="none" stroke="#7DB43A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class='name'>Vocation <b>SL</b></div>
  </div>
  <h1>Scan to get<br><span>Vocation SL</span></h1>
</div>
<div class='body'>
  <div class='qrs'>
    <div class='qr'><div class='box' id='qr-play'></div><img class='gp' src='../../landing/assets/google-play-badge.png' alt='Get it on Google Play'></div>
    <div class='qr ios'><div class='box' id='qr-ios'></div><img src='../../landing/assets/app-store-badge.svg' alt='Download on the App Store'></div>
  </div>
  <div class='search'>or search <span class='chip'><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#14171A" stroke-width="2.6"/><path d="M15.5 15.5L20 20" stroke="#14171A" stroke-width="2.6" stroke-linecap="round"/></svg>Vocation SL</span> &nbsp;·&nbsp; Free for job seekers</div>
</div>
<div class='hire'>
  <div class='ic'><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18" fill="none" stroke="#fff" stroke-width="2.2"/></svg></div>
  <div><b>Hiring? Post your jobs on Vocation SL</b><span>Ask us and we'll help you post your first job today.</span></div>
</div>
<div class='foot'><b>app.vocationsl.com</b> &nbsp;·&nbsp; info@vocationsl.com &nbsp;·&nbsp; +232 73 512 413</div>
<script>
  if (location.search.includes('android')) document.body.classList.add('android');
  for (const [id, file] of [['qr-play', 'qr-play.svg'], ['qr-ios', 'qr-appstore.svg']]) {
    const x = new XMLHttpRequest(); x.open('GET', file, false); x.send();
    document.getElementById(id).innerHTML = x.responseText;
  }
</script>
</body></html>
