<!doctype html><html><head><meta charset='utf-8'>
<link href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap' rel='stylesheet'>
<style>
/* Facebook cover, 1640 x 624. Phones crop the sides to about x 265–1375, so all text stays inside that area. */
*{box-sizing:border-box}
html,body{margin:0;width:1640px;height:624px;overflow:hidden}
body{font-family:'Plus Jakarta Sans',sans-serif;color:#fff;position:relative;
  background:
    radial-gradient(520px 420px at 72% 50%,rgba(125,180,58,.36),transparent 70%),
    radial-gradient(700px 400px at 0% 100%,rgba(0,0,0,.35),transparent 70%),
    linear-gradient(135deg,#123009 0%,#1E4510 45%,#2C5A14 100%)}
body:before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:40px 40px;mask-image:linear-gradient(90deg,transparent,#000 30%,#000)}
.ghost{position:absolute;right:-40px;top:-60px;width:620px;height:620px;opacity:.05}
.ghost2{position:absolute;left:-120px;bottom:-160px;width:520px;height:520px;opacity:.04}
.wrap{position:absolute;left:290px;top:50px;width:640px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:13px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.logo svg{width:36px;height:36px}
.name{font-size:27px;font-weight:800;letter-spacing:-.4px}
.name b{color:#9BD15A}
.pill{margin-left:8px;font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.9)}
h1{margin:22px 0 0;font-size:50px;line-height:1.04;font-weight:800;letter-spacing:-1.8px}
h1 span{color:#9BD15A}
.lead{margin:10px 0 0;font-size:18px;font-weight:500;color:rgba(255,255,255,.84)}
.features{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;padding:16px 20px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
.features div{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:600;color:rgba(255,255,255,.94)}
.features i{width:21px;height:21px;border-radius:50%;background:#9BD15A;display:grid;place-items:center;flex:none}
.features i svg{width:13px;height:13px}
.cta{margin-top:26px;display:flex;align-items:center;gap:14px}
.search{font-size:16px;font-weight:600;color:rgba(255,255,255,.88);display:flex;align-items:center;gap:8px}
.search b{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;background:#fff;color:#14171A;font-weight:800;font-size:17px}
.search b svg{width:16px;height:16px}
.cta img{height:44px;display:block}
.cta img.gp{height:61px;margin:0 -8px}
/* phones */
.phone{position:absolute;width:220px;height:466px;border-radius:36px;background:#0B0D0F;padding:8px;
  box-shadow:0 36px 70px rgba(0,0,0,.45),0 0 0 1.5px rgba(255,255,255,.12) inset}
.phone .screen{width:100%;height:100%;border-radius:28px;overflow:hidden;background:#fff;position:relative;padding-top:32px}
.phone img{width:100%;display:block}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:66px;height:19px;border-radius:11px;background:#0B0D0F;z-index:2}
.p1{left:970px;top:96px;transform:rotate(-6deg)}
.p2{left:1140px;top:58px;transform:rotate(5deg);z-index:2}
.badge{position:absolute;z-index:3;background:#fff;color:#14171A;border-radius:13px;padding:10px 14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 16px 36px rgba(0,0,0,.3);font-size:13.5px;font-weight:700}
.badge em{font-style:normal;display:block;font-size:11.5px;font-weight:600;color:#5F6B5A}
.badge .dot{width:32px;height:32px;border-radius:9px;background:#EEF5E4;display:grid;place-items:center}
.badge .dot svg{width:17px;height:17px}
.b1{left:960px;top:452px}
.b2{left:1205px;top:300px}
.foot{position:absolute;left:290px;top:572px;display:flex;gap:26px;font-size:14px;font-weight:600;color:rgba(255,255,255,.8)}
.foot b{color:#9BD15A;font-weight:700}
</style></head><body>
<svg class='ghost' viewBox="0 0 100 100"><path d="M26 14 L50 86 L74 14" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 86 L50 20 L72 86" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
<svg class='ghost2' viewBox="0 0 100 100"><path d="M26 14 L50 86 L74 14" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 86 L50 20 L72 86" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>

<div class='wrap'>
  <div class='brand'>
    <div class='logo'><svg viewBox="0 0 100 100"><path d="M26 14 L50 86 L74 14" fill="none" stroke="#14171A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 86 L50 20 L72 86" fill="none" stroke="#7DB43A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class='name'>Vocation <b>SL</b></div>
    <div class='pill'>Built for Sierra Leone</div>
  </div>
  <h1>Find work.<br><span>Hire the right people.</span></h1>
  <p class='lead'>Jobs across Sierra Leone, in one app.</p>
  <div class='features'></div>
  <div class='cta'>
    <div class='search'>Search <b><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#14171A" stroke-width="2.6"/><path d="M15.5 15.5L20 20" stroke="#14171A" stroke-width="2.6" stroke-linecap="round"/></svg>Vocation SL</b></div>
    <img class='gp' src='../../landing/assets/google-play-badge.png' alt='Get it on Google Play'>
    <img class='ios' src='../../landing/assets/app-store-badge.svg' alt='Download on the App Store'>
  </div>
</div>

<div class='phone p1'><div class='screen'><div class='notch'></div><img src='../screenshots/2-job-details.png'></div></div>
<div class='phone p2'><div class='screen'><div class='notch'></div><img src='../screenshots/1-find-jobs.png'></div></div>
<div class='badge b1'><div class='dot'><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z" fill="#3F7A1F"/></svg></div><div>Application sent<em>CV + cover letter (PDF)</em></div></div>
<div class='badge b2'><div class='dot'><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zm-2 15a2 2 0 0 0 4 0" fill="#3F7A1F"/></svg></div><div>New job alert<em>Matches your skills</em></div></div>

<div class='foot'><span><b>app.vocationsl.com</b></span><span>info@vocationsl.com</span><span>+232 73 512 413</span></div>

<script>
  const tick = '<i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#123009" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></i>';
  document.querySelector('.features').innerHTML = [
    'Jobs from all 16 districts', 'Apply with CV &amp; cover letter',
    'Track every application', 'Instant job alerts',
    'Message employers directly', 'Interview invitations',
    'Employers post jobs &amp; hire', 'Free for job seekers',
  ].map((f) => `<div>${tick}${f}</div>`).join('');
  if (location.search.includes('android')) document.querySelector('.ios').remove();
</script>
</body></html>
