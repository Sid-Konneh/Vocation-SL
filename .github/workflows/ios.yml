# Builds the iPhone app on a GitHub Mac and uploads it to App Store Connect
# (TestFlight). Run it by hand: GitHub > Actions > "iOS App Store" > Run workflow.
#
# Signing uses repository secrets (Settings > Secrets and variables > Actions):
#   IOS_P12_BASE64, IOS_P12_PASSWORD  Apple Distribution certificate (.p12)
#   IOS_PROFILE_BASE64                "Vocation SL App Store" profile for org.vocationsl.app
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8  App Store Connect API key (Admin)
# The originals are kept in Documents\Keys\ios-signing on the build PC, never
# in this repo. Certificate and profile expire on 29 Oct 2027.
#
# Version and build number come from pubspec.yaml; bump the build number
# before each upload, as Apple rejects one it has already seen.
name: iOS App Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: WZ949KH7QW
      BUNDLE_ID: org.vocationsl.app
      PROFILE_NAME: Vocation SL App Store
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security import $RUNNER_TEMP/dist.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security list-keychain -d user -s $KEYCHAIN $(security list-keychains -d user | tr -d '"')
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$PROFILE_BASE64" | base64 --decode > "$dir/vocationsl_appstore.mobileprovision"
          done

      - name: Use manual signing for the app target
        run: |
          # Only the Runner target (bundle ID org.vocationsl.app) is signed manually;
          # pods keep their own settings.
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; CODE_SIGN_IDENTITY = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/" ios/Runner.xcodeproj/project.pbxproj
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Build ipa
        run: |
          flutter pub get
          flutter build ipa --release \
            --export-options-plist=$RUNNER_TEMP/ExportOptions.plist \
            --dart-define=SUPABASE_URL=https://gkglfqsvxyemykpnjxik.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_eN8hZ_bBW_flojrgei4uew_J-coAe0m

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios -f build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: vocation-sl-ios
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Remove signing files
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/signing.keychain-db || true
          rm -rf ~/private_keys $RUNNER_TEMP/dist.p12
